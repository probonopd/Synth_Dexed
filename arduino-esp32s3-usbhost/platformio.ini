[env:esp32s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Pin frameworks to versions that include USB host hub support (ESP-IDF v5.x)
platform_packages =
  platformio/framework-espidf @ 3.50503.0
  platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.3.7

; Use the library from the repo root WITHOUT installing/copying it into .pio/libdeps
; (file://../.. can be very slow in large repos and looks like a hang)
lib_extra_dirs =
  ../..

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_FREERTOS_HZ=1000

; PSRAM cache workaround (common for S3; harmless if not needed)
  -mfix-esp32-psram-cache-issue

env_vars =
  ARDUINO_SKIP_TICK_CHECK=1
